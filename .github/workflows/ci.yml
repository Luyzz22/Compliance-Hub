name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip 'setuptools>=83.0.0' wheel
          python -m pip install --disable-pip-version-check -e '.[dev,api]' rank-bm25 pip-audit bandit

      - name: Lint and format check
        run: |
          ruff check app/ scripts/hetzner_release.py scripts/verify_release_evidence.py scripts/sovereign_release_build.py scripts/sovereign_restore_drill.py scripts/bootstrap_synthetic_demo.py deploy/hetzner/preflight-synthetic-demo.py tests/
          ruff format --check app/ scripts/hetzner_release.py scripts/verify_release_evidence.py scripts/sovereign_release_build.py scripts/sovereign_restore_drill.py scripts/bootstrap_synthetic_demo.py deploy/hetzner/preflight-synthetic-demo.py tests/

      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable --desc

      - name: Audit locked production dependency set
        run: pip-audit -r requirements.lock --desc

      - name: Generate backend CycloneDX SBOM
        run: pip-audit -r requirements.lock --format cyclonedx-json --output backend-sbom.cdx.json

      - name: Static security analysis
        run: |
          bandit -q -r app -x app/db_migrations -lll
          bandit -q scripts/hetzner_release.py scripts/verify_release_evidence.py scripts/sovereign_release_build.py scripts/sovereign_restore_drill.py scripts/bootstrap_synthetic_demo.py deploy/hetzner/preflight-synthetic-demo.py

      - name: Test
        run: python -m pytest tests/ -q

      - name: Validate Hetzner Compose blueprints
        run: |
          cd deploy/hetzner
          COMPLIANCEHUB_ENV_FILE=.env.production.example docker compose --env-file .env.production.example -f compose.yml config --quiet
          COMPLIANCEHUB_ENV_FILE=.env.synthetic-demo.example docker compose --env-file .env.synthetic-demo.example -f compose.synthetic-demo.yml config --quiet

      - name: Upload backend SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-cyclonedx-sbom
          path: backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  frontend:
    name: Frontend / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate

      - name: Generate frontend CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > frontend-sbom.cdx.json

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production compile
        run: npm run build

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-cyclonedx-sbom
          path: frontend/frontend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  container-security:
    name: Containers / build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: Dockerfile.hetzner
          - component: frontend
            context: .
            dockerfile: frontend/Dockerfile.hetzner
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build production image for security verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: compliancehub-ci/${{ matrix.component }}:${{ github.sha }}

      - name: Scan image and fail on High or Critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: compliancehub-ci/${{ matrix.component }}:${{ github.sha }}
          format: json
          output: trivy-${{ matrix.component }}.json
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Upload container scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.component }}-${{ github.sha }}
          path: trivy-${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 30

  release-evidence-contract:
    name: Release / evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Confirm the example remains fail-closed
        run: |
          if python3 scripts/verify_release_evidence.py deploy/hetzner/release-evidence.example.json --expected-commit HEAD; then
            echo "The placeholder release evidence unexpectedly passed" >&2
            exit 1
          fi

  policy:
    name: Policy / OPA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: v1.18.2

      - name: Test Rego policies
        run: opa test --v0-compatible infra/opa/policies/compliancehub/regos/

  postgres-rls:
    name: PostgreSQL 17 / RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
        env:
          POSTGRES_DB: compliancehub_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: compliancehub-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compliancehub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: compliancehub_ci
      PGUSER: postgres
      PGPASSWORD: compliancehub-ci-only
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Apply governed runtime migration
        run: |
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --file db/postgres/migrations/20260715_advisor_runtime_state_rls.sql
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --file db/postgres/migrations/20260715_advisor_runtime_state_rls.sql

      - name: Verify tenant isolation and deletion audit
        run: psql --no-psqlrc --set=ON_ERROR_STOP=1 --file tests/postgres/advisor_runtime_state_rls_test.sql

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
